<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Lista de Tarefas</h1>

    <!-- FORMULÁRIO: CREATE -->
    <form id="task-form" autocomplete="off">
      <input
        id="task-input"
        type="text"
        placeholder="Digite uma tarefa..."
        required
      />
      <button type="submit">Adicionar</button>
    </form>

    <div class="toolbar">
      <!-- FILTROS: READ POR STATUS -->
      <div class="filters">
        <button data-filter="all" class="active">Todas</button>
        <button data-filter="active">Pendentes</button>
        <button data-filter="done">Concluídas</button>
      </div>

      <!-- BUSCA + ORDENAÇÃO -->
      <div class="search-sort">
        <input
          id="search"
          type="search"
          placeholder="Buscar..."
          aria-label="Buscar tarefas pelo texto"
        />
        <select id="sort" aria-label="Ordenar tarefas">
          <option value="created_desc">Mais novas</option>
          <option value="created_asc">Mais antigas</option>
          <option value="az">A–Z</option>
          <option value="status">Pendentes primeiro</option>
        </select>
      </div>

      <!-- RESUMO + LIMPAR CONCLUÍDAS -->
      <div class="summary">
        <span id="counter">0 pendentes / 0 totais</span>
        <button
          id="clear-done"
          type="button"
          title="Remover todas as tarefas concluídas"
        >
          Limpar concluídas
        </button>
      </div>
    </div>

    <!-- LISTA DE TAREFAS -->
    <ul id="task-list"></ul>

    <!-- DICA DE USO -->
    <footer class="hint">
      <small>
        Dica: dê <b>duplo clique</b> no título para editar.
        <kbd>Enter</kbd> salva e <kbd>Esc</kbd> cancela.
      </small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
