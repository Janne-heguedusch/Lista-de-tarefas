<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Lista de Tarefas</h1>

    <form id="task-form" autocomplete="off">
      <input id="task-input" type="text" placeholder="Digite uma tarefa..." required />
      <button type="submit">Adicionar</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button data-filter="all" class="active">Todas</button>
        <button data-filter="active">Pendentes</button>
        <button data-filter="done">Concluídas</button>
      </div>
      <div class="summary">
        <span id="counter">0 pendentes / 0 totais</span>
        <button id="clear-done" title="Remover todas as concluídas">Limpar concluídas</button>
      </div>
    </div>

    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
